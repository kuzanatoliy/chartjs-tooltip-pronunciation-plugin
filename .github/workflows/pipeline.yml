name: pipeline
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: install
        run: npm ci
      - name: build
        run: npm run build
      - name: test
        run: npm run test
      - name: prettier
        run: npm run prettier:check
  publish:
    if: github.ref_name == 'master'
    needs: quality-gates
    runs-on: ubuntu-latest
    environment: deployment
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
      - name: install
        run: npm ci
      - name: build
        run: npm run build
      - name: git configuration
        run: |
          git config --global user.email "njkznu@gmail.com"
          git config --global user.name "kuzanatoliy"
      - name: minor tag
        if: github.event_name == 'push'
        run: npm version minor
      - name: major tag
        if: github.event_name == 'workflow_dispatch'
        run: npm version major
      - name: push commits
        run: |
          git push
          git push --tags
      - name: add bundle
        run: git add -f dist
      - name: publish
        run: npm publish --access public
  trigger-update:
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ github.ref_name == 'master' && needs.publish.result == 'success'}}
    environment: updates
    steps:
      - name: Trigger Autotests
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PLUGIN_UPDATES }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'kuzanatoliy',
              repo: 'chartjs-demo',
              workflow_id: 'update-plugin.yml',
              ref: 'master',
              inputs: {
                plugin: 'chartjs-legend-keyboard-plugin'
              }
            });
